<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#080d19; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0d1829" />
      <stop offset="100%" stop-color="#081020" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes packetFloat {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(480px); opacity: 0; }
      }
      @keyframes beaconPing {
        0% { r: 4px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }

      .radar-arm {
        transform-origin: 1040px 180px;
        animation: radarSweep 8s linear infinite;
      }
      .circuit-line {
        stroke-dasharray: 20 10;
        animation: circuitFlow 12s linear infinite;
      }
      .circuit-line-fast {
        stroke-dasharray: 12 8;
        animation: circuitFlow 6s linear infinite;
      }
      .packet-1 {
        animation: packetFloat 4s ease-in-out infinite;
      }
      .packet-2 {
        animation: packetFloat 5s ease-in-out infinite 1.5s;
      }
      .ping-beacon {
        animation: beaconPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .ping-beacon-delayed {
        animation: beaconPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.25s;
      }
      .pulsing-orb {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- DYNAMIC BACKGROUND LAYER: Animated Cyber Grid & Nodes -->
  <g opacity="0.25">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />

    <!-- Vertical Grid Lines -->
    <line x1="150" y1="0" x2="150" y2="360" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="450" y1="0" x2="450" y2="360" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="750" y1="0" x2="750" y2="360" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="360" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 8" />
  </g>

  <!-- DYNAMIC BACKGROUND LAYER: Animated ICS / OT Pipeline Network Lines -->
  <g opacity="0.35">
    <path class="circuit-line" d="M 50 310 L 280 310 L 350 250 L 580 250 L 640 310 L 900 310" fill="none" stroke="#00f0ff" stroke-width="2" />
    <path class="circuit-line-fast" d="M 120 50 L 320 50 L 400 110 L 720 110 L 800 50 L 1150 50" fill="none" stroke="#34d399" stroke-width="1.5" />
    <path class="circuit-line" d="M 850 180 L 980 180 L 1020 140 L 1150 140" fill="none" stroke="#f59e0b" stroke-width="1.8" />
  </g>

  <!-- Dynamic Flying Data Packets -->
  <g class="packet-1">
    <circle cx="80" cy="50" r="4" fill="#34d399" filter="url(#glow)" />
  </g>
  <g class="packet-2">
    <circle cx="100" cy="310" r="4.5" fill="#00f0ff" filter="url(#glow)" />
  </g>

  <!-- DYNAMIC BACKGROUND LAYER: Industrial Radar Scanner (Right-Hand Side) -->
  <g transform="translate(0, 0)" opacity="0.4">
    <!-- Concentric Target Circles -->
    <circle cx="1040" cy="180" r="140" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="6 6" />
    <circle cx="1040" cy="180" r="100" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6" />
    <circle cx="1040" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.8" />
    <circle cx="1040" cy="180" r="20" fill="none" stroke="#00f0ff" stroke-width="2" />

    <!-- Pulsing Node Targets (Sensors / PLCs) -->
    <circle cx="1080" cy="130" r="5" fill="#ef4444" filter="url(#glow)" />
    <circle cx="1080" cy="130" class="ping-beacon" fill="none" stroke="#ef4444" stroke-width="1.5" />
    
    <circle cx="990" cy="220" r="4.5" fill="#10b981" filter="url(#glow)" />
    <circle cx="990" cy="220" class="ping-beacon-delayed" fill="none" stroke="#10b981" stroke-width="1.5" />

    <circle cx="1090" cy="235" r="4" fill="#f59e0b" filter="url(#glow)" />

    <!-- Rotating Radar Sweep Line -->
    <g class="radar-arm">
      <line x1="1040" y1="180" x2="1180" y2="180" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" filter="url(#glow)" />
      <!-- Subtle sweep beam gradient cone -->
      <path d="M 1040 180 L 1180 180 A 140 140 0 0 0 1160 110 Z" fill="#0284c7" opacity="0.18" />
    </g>
  </g>

  <!-- AMBIENT GLOW IN BACKGROUND -->
  <circle cx="240" cy="180" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="850" cy="90" r="120" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- ======================================================== -->
  <!-- FOREGROUND CONTENT LAYER: Protected, Crisp, Prominent    -->
  <!-- ======================================================== -->

  <!-- Top Decorative Pill / Category Tag -->
  <g transform="translate(60, 42)">
    <rect width="280" height="30" rx="15" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="18" cy="15" r="5" fill="#10b981" class="pulsing-orb" />
    <text x="32" y="20" fill="#93c5fd" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
      OPERATIONAL TECHNOLOGY (OT)
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 126)">
    <!-- High-contrast drop shadow backing for guaranteed readability -->
    <text x="0" y="0" fill="#030712" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" opacity="0.8">
      Awesome-OT-Management
    </text>
    <text x="-1" y="-1" fill="url(#titleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
      Awesome-OT-Management
    </text>
  </g>

  <!-- Subtitle / Meta Description -->
  <g transform="translate(60, 165)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="500">
      Curated Ecosystem of SaaS Platforms &amp; Open-Source Tools for Cyber-Physical Systems
    </text>
    <text x="0" y="24" fill="#64748b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      OT Asset Visibility • Industrial Cybersecurity • SCADA/ICS Defense • Purdue Model Hardening
    </text>
  </g>

  <!-- Feature Cards / Badges in Foreground -->
  <g transform="translate(60, 235)">
    <!-- Pill 1: OT Asset Discovery -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="14" y="26" font-size="18">🏭</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        Asset Visibility
      </text>
    </g>

    <!-- Pill 2: ICS/SCADA Protection -->
    <g transform="translate(194, 0)">
      <rect width="200" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="14" y="26" font-size="18">🛡️</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        ICS / SCADA Defense
      </text>
    </g>

    <!-- Pill 3: Cyber-Physical Systems -->
    <g transform="translate(408, 0)">
      <rect width="190" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="14" y="26" font-size="18">⚡</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        IEC 62443 Scoping
      </text>
    </g>

    <!-- Pill 4: Open Source & SaaS -->
    <g transform="translate(612, 0)">
      <rect width="176" height="42" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="14" y="26" font-size="18">🌐</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
        SaaS &amp; Self-Hosted
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="#0ea5e9" stroke-width="2" opacity="0.8" />
</svg>
